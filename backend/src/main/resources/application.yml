# PalCheck backend configuration. Secrets are never committed: values come from the environment
# (locally from ../.env, see .env.example). Defaults here are safe, non-secret values only.
spring:
  application:
    name: palcheck
  datasource:
    url: ${PALCHECK_DB_URL:jdbc:postgresql://localhost:5432/palcheck}
    username: ${PALCHECK_DB_USER:palcheck}
    password: ${PALCHECK_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # One globally ordered migration stream; each file names its owning module in a header comment.
    validate-on-migrate: true
    clean-disabled: true
  # OpenID Connect login. The registration id ("oidc") is vendor-neutral on purpose: Keycloak is only the local
  # development identity provider, selected by these properties and nothing in PalCheck code depends on it.
  # Startup performs OIDC discovery against the issuer, so a misconfigured issuer fails fast and visibly.
  security:
    oauth2:
      client:
        registration:
          oidc:
            client-id: palcheck-web
            client-secret: ${PALCHECK_OIDC_CLIENT_SECRET:}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: true          # overridden to false by the dev profile (plain http on localhost)
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    root: INFO
    com.palcheck: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.jdbc: INFO
  # One JSON object per line (Elastic Common Schema). Everything in the logging context (requestId, correlationId,
  # tenantId, userId, operation) becomes a field, so logs can be filtered by tenant or request without parsing text.
  # The `dev` and `test` profiles turn this off for readable console output.
  structured:
    format:
      console: ecs

---
# OIDC discovery from the issuer. Skipped by the `test` profile, which configures explicit endpoints so that no
# identity provider needs to be running for most tests.
spring:
  config:
    activate:
      on-profile: "!test"
  security:
    oauth2:
      client:
        provider:
          oidc:
            issuer-uri: ${PALCHECK_OIDC_ISSUER_URI:http://localhost:8180/realms/palcheck}
