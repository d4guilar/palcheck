# PalCheck backend configuration. Secrets are never committed: values come from the environment
# (locally from ../.env, see .env.example). Defaults here are safe, non-secret values only.
spring:
  application:
    name: palcheck
  datasource:
    url: ${PALCHECK_DB_URL:jdbc:postgresql://localhost:5432/palcheck}
    username: ${PALCHECK_DB_USER:palcheck}
    password: ${PALCHECK_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    # One globally ordered migration stream; each file names its owning module in a header comment.
    validate-on-migrate: true
    clean-disabled: true
  # OpenID Connect login. The registration id ("oidc") is vendor-neutral on purpose: Keycloak is only the local
  # development identity provider, selected by these properties and nothing in PalCheck code depends on it.
  # Startup performs OIDC discovery against the issuer, so a misconfigured issuer fails fast and visibly.
  security:
    oauth2:
      client:
        registration:
          oidc:
            client-id: palcheck-web
            client-secret: ${PALCHECK_OIDC_CLIENT_SECRET:}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  # Local Kafka (KRaft mode, native process — no Docker; see docs/LOCAL_DEVELOPMENT.md). Values are always strings
  # on the wire: PalCheck serializes its own IntegrationEvent envelope to/from JSON itself (ADR-0026), so Kafka's
  # (de)serializers never need to know about a PalCheck type.
  kafka:
    bootstrap-servers: ${PALCHECK_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Every consumer group starts from the beginning the first time it exists, rather than silently skipping
      # everything published before its first connection — correct for Phase 3's small, replayable event volume.
      auto-offset-reset: earliest

palcheck:
  idempotency:
    # Guaranteed retry window for original successful writes. Legacy property name retained for compatibility.
    # ISO-8601 duration; startup rejects values below PT24H. Receipt cleanup does not make a resend safe.
    ttl: PT24H
  messaging:
    # Single topic for Phase 3's one integration event type (ADR-0026); versioned in its own name rather than a
    # schema registry, so a breaking change ships as palcheck.workforce.events.v2 without touching this one.
    topic: palcheck.workforce.events.v1
    # Shared outbox-publisher and consumer retry schedule (ADR-0027 decision 4): a documented simplification, not
    # a claim every future integration should reuse these numbers.
    retry-delays: PT5S,PT30S,PT2M,PT10M

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: true          # overridden to false by the dev profile (plain http on localhost)
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    root: INFO
    com.palcheck: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.jdbc: INFO
  # One JSON object per line (Elastic Common Schema). Everything in the logging context (requestId, correlationId,
  # tenantId, userId, operation) becomes a field, so logs can be filtered by tenant or request without parsing text.
  # The `dev` and `test` profiles turn this off for readable console output.
  structured:
    format:
      console: ecs

---
# OIDC discovery from the issuer. Skipped by the `test` profile, which configures explicit endpoints so that no
# identity provider needs to be running for most tests.
spring:
  config:
    activate:
      on-profile: "!test"
  security:
    oauth2:
      client:
        provider:
          oidc:
            issuer-uri: ${PALCHECK_OIDC_ISSUER_URI:http://localhost:8180/realms/palcheck}
