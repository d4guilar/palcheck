# Browser end-to-end tests against the real stack: PostgreSQL and Keycloak from docker-compose.yml, the Spring Boot
# backend in the `dev` profile (which seeds synthetic demo data), the Vite app, and Playwright driving Chromium.
# Manually dispatched: it needs a container runtime and takes a few minutes, so it is not part of every push (ci.yml).
#
# UNVERIFIED IN THE AUTHORING ENVIRONMENT: the same flow was run locally against a local Keycloak and PostgreSQL (see
# docs/WORKLOG.md), but this workflow and docker-compose.yml have not been executed on a machine with Docker yet.
name: E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The committed template holds development-only placeholder values, never real secrets.
      - name: Create the local environment file
        run: cp .env.example .env

      - name: Start PostgreSQL and Keycloak
        run: docker compose up -d --wait postgres keycloak || docker compose up -d postgres keycloak

      - name: Wait for the identity provider
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8180/realms/palcheck/.well-known/openid-configuration > /dev/null; then exit 0; fi
            sleep 5
          done
          docker compose logs keycloak
          exit 1

      - name: Start the backend
        working-directory: backend
        run: |
          ./mvnw -B -ntp -DskipTests package
          set -a; . ../.env; set +a
          nohup java -jar target/palcheck-*.jar --spring.profiles.active=dev > ../backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health/readiness | grep -q UP; then exit 0; fi
            sleep 3
          done
          cat ../backend.log
          exit 1

      - name: Install web dependencies and the browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start the web app
        working-directory: web
        run: |
          nohup npm run dev > ../web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5173/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat ../web.log
          exit 1

      - name: Run the end-to-end tests
        working-directory: web
        run: npx playwright test
        env:
          CI: "true"

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
            backend.log
            web.log
          if-no-files-found: ignore
